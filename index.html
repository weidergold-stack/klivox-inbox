<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Klivox · Bandeja WhatsApp</title>
<style>
  :root{--bg:#0a0f1c;--panel:#111a2e;--panel2:#0d1526;--panel3:#16233d;--brd:rgba(255,255,255,.09);--txt:#e9eefb;--muted:#8a98b8;--cyan:#22d3ee;--blue:#3b82f6;--green:#25d366;--grad:linear-gradient(120deg,#3b82f6,#22d3ee)}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);height:100vh;height:100dvh;overflow:hidden}
  .hidden{display:none!important}
  input,textarea{font-family:inherit;background:var(--panel2);border:1px solid var(--brd);border-radius:11px;color:var(--txt);outline:none;font-size:16px}
  input:focus,textarea:focus{border-color:var(--cyan)}
  .btn{background:var(--grad);border:none;color:#04121f;font-weight:700;font-family:inherit;font-size:15px;padding:13px 18px;border-radius:11px;cursor:pointer;width:100%}
  .logo{width:52px;height:52px;border-radius:14px;background:var(--grad);display:grid;place-items:center;font-weight:800;font-size:24px;color:#04121f}
  /* login */
  #login{height:100dvh;display:grid;place-items:center;padding:20px}
  .card{background:var(--panel);border:1px solid var(--brd);border-radius:18px;padding:34px;width:340px;max-width:100%;text-align:center}
  .card .logo{margin:0 auto 16px}
  .card h1{font-size:19px;margin-bottom:4px}
  .card p{color:var(--muted);font-size:13px;margin-bottom:20px}
  #login input{width:100%;padding:13px 14px;margin-bottom:12px}
  .err{color:#fca5a5;font-size:12.5px;margin-top:8px;min-height:16px}
  /* app */
  #app{display:grid;grid-template-columns:340px 1fr;height:100dvh}
  .side{border-right:1px solid var(--brd);background:var(--panel2);display:flex;flex-direction:column;min-height:0}
  .side-h{padding:14px 16px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:10px}
  .side-h .logo{width:36px;height:36px;font-size:18px;border-radius:10px}
  .side-h b{font-size:15px}.side-h small{display:block;color:var(--cyan);font-size:11px}
  .ico{background:none;border:1px solid var(--brd);color:var(--txt);border-radius:9px;width:38px;height:38px;font-size:17px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto}
  .ico:hover{background:rgba(255,255,255,.05)}
  .searchwrap{padding:10px 14px;border-bottom:1px solid var(--brd)}
  .searchwrap input{width:100%;padding:10px 14px;font-size:15px}
  .convs{overflow-y:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
  .conv{padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;display:flex;gap:11px;align-items:center}
  .conv:hover{background:rgba(255,255,255,.03)}
  .conv.active{background:rgba(34,211,238,.10)}
  .av{flex:0 0 42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#25d366,#128c7e);display:grid;place-items:center;font-weight:700;font-size:15px;color:#04121f;text-transform:uppercase}
  .conv .meta{flex:1;min-width:0}
  .conv .meta .top{display:flex;justify-content:space-between;gap:8px}
  .conv .name{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv .time{font-size:11px;color:var(--muted);flex:0 0 auto}
  .conv .last{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .conv .dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex:0 0 auto}
  .side-empty{padding:24px;color:var(--muted);font-size:13px;text-align:center}
  /* thread */
  .main{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
  .main-h{padding:12px 16px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:11px;background:var(--panel2)}
  .main-h .who{flex:1;min-width:0}
  .main-h .name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .main-h .num{font-size:12px;color:var(--muted)}
  .back{display:none;background:none;border:none;color:var(--txt);font-size:24px;line-height:1;cursor:pointer;padding:2px 6px 2px 0}
  .empty{flex:1;display:grid;place-items:center;color:var(--muted);text-align:center;padding:30px;font-size:14px}
  .thread{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:9px;min-height:0;-webkit-overflow-scrolling:touch}
  .bub{max-width:72%;padding:9px 13px;border-radius:14px;font-size:14.5px;line-height:1.45;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap}
  .bub .t{display:block;font-size:10px;color:var(--muted);margin-top:4px;text-align:right}
  .in{align-self:flex-start;background:var(--panel);border:1px solid var(--brd);border-bottom-left-radius:4px}
  .out{align-self:flex-end;background:#075e54;border-bottom-right-radius:4px}
  .out .t{color:#bfeadf}
  .composer{border-top:1px solid var(--brd);padding:10px 14px;background:var(--panel2)}
  .win-warn{font-size:12px;color:#fcd34d;margin-bottom:8px;display:none}
  .composer .row{display:flex;gap:9px;align-items:flex-end}
  .composer textarea{flex:1;resize:none;padding:11px 14px;max-height:120px;min-height:46px}
  .composer .send,.composer .tpl{border:none;border-radius:11px;cursor:pointer;flex:0 0 auto;height:46px}
  .composer .send{background:var(--grad);width:50px;color:#04121f;font-size:19px}
  .composer .tpl{width:46px;background:var(--panel3);color:var(--cyan);font-size:18px;border:1px solid var(--brd)}
  .send-err{font-size:12px;color:#fca5a5;margin-top:6px;min-height:14px}
  .composer.locked textarea{opacity:.45;cursor:not-allowed;background:var(--panel3)}
  .composer.locked .send{opacity:.35;cursor:not-allowed;filter:grayscale(1)}
  .composer.locked .tpl{background:var(--grad);color:#04121f;border:none;animation:tplpulse 1.8s infinite}
  @keyframes tplpulse{0%{box-shadow:0 0 0 0 rgba(34,211,238,.55)}70%{box-shadow:0 0 0 8px rgba(34,211,238,0)}100%{box-shadow:0 0 0 0 rgba(34,211,238,0)}}
  /* modal / sheet */
  .overlay{position:fixed;inset:0;background:rgba(3,7,18,.72);z-index:40;display:flex;align-items:center;justify-content:center;padding:18px}
  .modal{background:var(--panel);border:1px solid var(--brd);border-radius:16px;padding:22px;width:400px;max-width:100%;max-height:88dvh;overflow-y:auto}
  .modal h2{font-size:17px;margin-bottom:14px}
  .modal label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 5px}
  .modal input{width:100%;padding:11px 13px}
  .modal .actions{display:flex;gap:10px;margin-top:18px}
  .modal .actions .btn{flex:1}
  .btn.ghost{background:none;border:1px solid var(--brd);color:var(--txt)}
  .tpl-item{border:1px solid var(--brd);border-radius:11px;padding:11px 13px;margin-bottom:9px;cursor:pointer;background:var(--panel2)}
  .tpl-item:hover{border-color:var(--cyan)}
  .tpl-item .tt{font-size:13.5px;font-weight:600;margin-bottom:3px}
  .tpl-item .tm{font-size:12.5px;color:var(--muted);white-space:pre-wrap}
  .tpl-item .del{float:right;color:#fca5a5;font-size:12px;cursor:pointer;border:none;background:none}
  .muted-note{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.5}
  .sec-title{font-size:12px;font-weight:700;color:var(--cyan);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 9px}
  .sec-title:first-of-type{margin-top:6px}
  .badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;vertical-align:middle;margin-left:6px}
  .badge.ok{background:rgba(37,211,102,.16);color:#4ade80;border:1px solid rgba(37,211,102,.4)}
  .badge.wait{background:rgba(252,211,77,.14);color:#fcd34d;border:1px solid rgba(252,211,77,.4)}
  .badge.no{background:rgba(252,165,165,.14);color:#fca5a5;border:1px solid rgba(252,165,165,.4)}
  .tpl-item.meta{border-left:3px solid var(--brd)}
  .tpl-item.meta.ok{border-left-color:#25d366}
  .tpl-item.meta.wait{border-left-color:#fcd34d}
  .tpl-item.meta.no{border-left-color:#fca5a5}
  .tpl-item.meta.locked{opacity:.6;cursor:not-allowed}
  .tpl-item .btns{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
  .tpl-item .btns span{font-size:11px;color:var(--muted);border:1px solid var(--brd);border-radius:7px;padding:2px 8px}
  /* ---- MOBILE ---- */
  @media(max-width:760px){
    #app{grid-template-columns:1fr;position:relative}
    .side{position:absolute;inset:0;width:100%;z-index:5}
    .main{position:absolute;inset:0;width:100%;z-index:6;transform:translateX(100%);transition:transform .22s ease;will-change:transform}
    #app.show-thread .main{transform:translateX(0)}
    .back{display:block}
    .av{flex-basis:46px;height:46px;font-size:16px}
    .bub{max-width:85%;font-size:15px}
    .composer{padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  }
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <div class="logo">K</div>
    <h1>Bandeja WhatsApp</h1>
    <p>Klivox Automatizaciones</p>
    <input id="pass" type="password" placeholder="Contraseña de acceso" autocomplete="current-password"/>
    <button class="btn" onclick="login()">Entrar</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="side" id="side">
    <div class="side-h">
      <div class="logo">K</div>
      <div style="flex:1"><b>Klivox</b><small>● WhatsApp</small></div>
      <button class="ico" title="Nuevo chat" onclick="openNewChat()">✚</button>
      <button class="ico" title="Actualizar" onclick="load()">↻</button>
    </div>
    <div class="searchwrap"><input id="search" placeholder="🔍  Buscar por nombre o número…" oninput="renderConvs()"/></div>
    <div class="convs" id="convs"></div>
  </div>
  <div class="main">
    <div class="main-h" id="mainH"><span class="name">Selecciona una conversación</span></div>
    <div class="empty" id="empty">💬 Elige un chat o crea uno nuevo con ✚</div>
    <div class="thread hidden" id="thread"></div>
    <div class="composer hidden" id="composer">
      <div class="win-warn" id="winWarn">🔒 Pasaron más de 24 h desde el último mensaje. Para responder toca 📋 y envía una plantilla aprobada.</div>
      <div class="row">
        <button class="tpl" title="Plantillas" onclick="openTemplates()">📋</button>
        <textarea id="reply" placeholder="Escribe una respuesta…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
        <button class="send" onclick="send()">➤</button>
      </div>
      <div class="send-err" id="sendErr"></div>
    </div>
  </div>
</div>

<div id="modalRoot"></div>

<script>
let PASS=localStorage.getItem('kv_pass')||'';
let messages=[], convs={}, current=null, metaTemplates=[];
let names=JSON.parse(localStorage.getItem('kv_names')||'{}');
let contacts=JSON.parse(localStorage.getItem('kv_contacts')||'[]');
let templates=JSON.parse(localStorage.getItem('kv_templates')||'null');
if(!templates){templates=[
  {t:'Saludo',m:'¡Hola {nombre}! 👋 Soy de Klivox Automatizaciones. ¿En qué puedo ayudarte hoy?'},
  {t:'Agendar',m:'Con gusto te agendamos. ¿Qué día y hora te queda mejor?'},
  {t:'Precio / asesor',m:'Para darte un precio exacto te conecto con un asesor. ¿Me confirmas tu nombre y lo que necesitas?'},
  {t:'Gracias',m:'¡Gracias por escribirnos! Cualquier cosa, aquí estamos. 😊'}
];saveTpl();}

function saveNames(){localStorage.setItem('kv_names',JSON.stringify(names));}
function saveContacts(){localStorage.setItem('kv_contacts',JSON.stringify(contacts));}
function saveTpl(){localStorage.setItem('kv_templates',JSON.stringify(templates));}
function hdr(){return{'x-inbox-pass':PASS,'Content-Type':'application/json'}}
function fmtNum(n){return (n||'').replace('whatsapp:','')}
function nameOf(num){return names[num]||num}
function initials(s){s=(s||'').trim();const w=s.replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ\s]/g,'').split(/\s+/).filter(Boolean);if(w.length>=2)return w[0][0]+w[1][0];if(w.length===1)return w[0].slice(0,2);const d=s.replace(/\D/g,'');return d.slice(-2)||'#';}
function fmtTime(d){const t=new Date(d);const now=new Date();const sameDay=t.toDateString()===now.toDateString();
  return sameDay? t.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}) : t.toLocaleDateString('es-CO',{day:'2-digit',month:'2-digit'})+' '+t.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})}
function esc(s){return (s||'').replace(/</g,'&lt;')}

async function login(){
  PASS=document.getElementById('pass').value.trim();
  document.getElementById('loginErr').textContent='';
  const r=await fetch('/api/messages',{headers:hdr()});
  if(r.status===401){document.getElementById('loginErr').textContent='Contraseña incorrecta.';return;}
  localStorage.setItem('kv_pass',PASS);
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  await load();loadMetaTemplates();setInterval(load,8000);setInterval(loadMetaTemplates,60000);
}

async function loadMetaTemplates(){
  try{
    const r=await fetch('/api/templates',{headers:hdr()});
    if(!r.ok)return;
    const d=await r.json();
    metaTemplates=d.templates||[];
  }catch(e){}
}

async function load(){
  try{
    const r=await fetch('/api/messages',{headers:hdr()});
    if(r.status===401){logout();return;}
    const d=await r.json();
    messages=d.messages||[];
    convs={};
    for(const m of messages){
      const other=(m.direction==='inbound')?fmtNum(m.from):fmtNum(m.to);
      if(!convs[other])convs[other]={num:other,msgs:[]};
      convs[other].msgs.push(m);
    }
    for(const num of contacts){ if(!convs[num]) convs[num]={num,msgs:[]}; }
    Object.values(convs).forEach(c=>c.msgs.sort((a,b)=>new Date(a.date)-new Date(b.date)));
    renderConvs();
    if(current&&convs[current])renderThread(current);
  }catch(e){}
}

function lastInbound(c){let t=0;for(const m of c.msgs){if(m.direction==='inbound'){const x=new Date(m.date).getTime();if(x>t)t=x}}return t}
function lastActivity(c){return c.msgs.length? new Date(c.msgs[c.msgs.length-1].date).getTime() : 0}

function renderConvs(){
  const q=(document.getElementById('search').value||'').toLowerCase().trim();
  let list=Object.values(convs).sort((a,b)=>lastActivity(b)-lastActivity(a));
  if(q) list=list.filter(c=> (nameOf(c.num)+' '+c.num).toLowerCase().includes(q));
  const el=document.getElementById('convs');
  if(!list.length){el.innerHTML='<div class="side-empty">'+(q?'Sin resultados para "'+esc(q)+'".':'Aún no hay conversaciones. Cuando alguien escriba a tu WhatsApp aparecerá aquí, o crea un chat con ✚.')+'</div>';return;}
  el.innerHTML=list.map(c=>{
    const last=c.msgs.length?c.msgs[c.msgs.length-1]:null;
    const unread=last&&last.direction==='inbound';
    const prev=last? ((last.direction!=='inbound'?'Tú: ':'')+(esc(last.body)||'—')) : 'Nuevo chat — escribe el primer mensaje';
    const tm=last?fmtTime(last.date):'';
    return `<div class="conv ${current===c.num?'active':''}" onclick="open_('${c.num}')">
      <div class="av">${esc(initials(nameOf(c.num)))}</div>
      <div class="meta"><div class="top"><span class="name">${esc(nameOf(c.num))}</span><span class="time">${tm}</span></div>
      <div class="last">${prev}</div></div>
      ${unread?'<span class="dot"></span>':''}
    </div>`}).join('');
}

function open_(num){current=num;renderConvs();renderThread(num);document.getElementById('app').classList.add('show-thread');}
function backToList(){document.getElementById('app').classList.remove('show-thread');current=null;renderConvs();}

function renderThread(num){
  const c=convs[num];if(!c)return;
  document.getElementById('empty').classList.add('hidden');
  document.getElementById('thread').classList.remove('hidden');
  document.getElementById('composer').classList.remove('hidden');
  document.getElementById('mainH').innerHTML=
    `<button class="back" onclick="backToList()" aria-label="Volver">←</button>
     <div class="av">${esc(initials(nameOf(num)))}</div>
     <div class="who"><div class="name">${esc(nameOf(num))}</div><div class="num">${esc(num)}</div></div>
     <button class="ico" title="Editar nombre" onclick="renameContact('${num}')">✎</button>`;
  const th=document.getElementById('thread');
  if(!c.msgs.length){
    th.innerHTML='<div style="margin:auto;color:#8a98b8;text-align:center;font-size:13.5px">Nuevo chat con '+esc(nameOf(num))+'.<br>Escribe el primer mensaje abajo.<br><span style="font-size:12px">(WhatsApp exige plantilla aprobada si el contacto no te ha escrito en 24 h.)</span></div>';
  }else{
    th.innerHTML=c.msgs.map(m=>{const cls=m.direction==='inbound'?'in':'out';
      return `<div class="bub ${cls}">${esc(m.body)||'<i>(sin texto)</i>'}<span class="t">${fmtTime(m.date)}</span></div>`}).join('');
  }
  th.scrollTop=th.scrollHeight;
  const inside=lastInbound(c)>0 && (Date.now()-lastInbound(c))/36e5<=24;
  const comp=document.getElementById('composer');
  const ta2=document.getElementById('reply');
  const sb=comp.querySelector('.send');
  if(inside){
    comp.classList.remove('locked');
    ta2.disabled=false; if(sb)sb.disabled=false;
    ta2.placeholder='Escribe una respuesta…';
    document.getElementById('winWarn').style.display='none';
  }else{
    comp.classList.add('locked');
    ta2.value=''; ta2.disabled=true; if(sb)sb.disabled=true;
    ta2.placeholder='🔒 Fuera de la ventana de 24 h — usa 📋 plantillas';
    document.getElementById('winWarn').style.display='block';
  }
}

async function send(){
  if(!current)return;
  const ta=document.getElementById('reply');
  if(ta.disabled)return;
  const text=ta.value.trim();if(!text)return;
  document.getElementById('sendErr').textContent='';ta.value='';
  const r=await fetch('/api/send',{method:'POST',headers:hdr(),body:JSON.stringify({to:current,body:text})});
  const d=await r.json();
  if(!d.ok){document.getElementById('sendErr').textContent=d.code===63016?'Fuera de la ventana de 24 h: se requiere una plantilla aprobada.':('No se pudo enviar: '+(d.error||'error'));ta.value=text;}
  await load();
}

/* ---- Nuevo chat / contactos ---- */
function normNum(n){n=(n||'').replace(/[^\d+]/g,'');if(n&&!n.startsWith('+'))n='+'+n;return n;}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}
function openNewChat(){
  document.getElementById('modalRoot').innerHTML=`
   <div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h2>Nuevo chat</h2>
    <label>Número de WhatsApp (con código de país)</label>
    <input id="ncNum" placeholder="+57 300 123 4567" inputmode="tel"/>
    <label>Nombre del contacto (opcional)</label>
    <input id="ncName" placeholder="Ej: Dra. Laura Pérez"/>
    <div class="actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="createChat()">Abrir chat</button></div>
    <div class="muted-note">Podrás escribir de una vez si el contacto te escribió en las últimas 24 h. Si no, WhatsApp exige una plantilla aprobada por Meta.</div>
   </div></div>`;
  setTimeout(()=>document.getElementById('ncNum').focus(),50);
}
function createChat(){
  const num=normNum(document.getElementById('ncNum').value);
  const nm=document.getElementById('ncName').value.trim();
  if(num.replace('+','').length<8){alert('Número inválido. Incluye el código de país, ej: +57...');return;}
  if(!contacts.includes(num)){contacts.push(num);saveContacts();}
  if(nm){names[num]=nm;saveNames();}
  if(!convs[num])convs[num]={num,msgs:[]};
  closeModal();open_(num);
}
function renameContact(num){
  const cur=names[num]||'';
  const nm=prompt('Nombre para '+num+':',cur);
  if(nm===null)return;
  if(nm.trim()){names[num]=nm.trim();}else{delete names[num];}
  saveNames();renderConvs();renderThread(num);
}

/* ---- Plantillas ---- */
const badgeInfo={approved:['ok','● Aprobada'],pending:['wait','● En revisión'],rejected:['no','● Rechazada']};
function metaPreview(t){
  const nm=current?nameOf(current).split(' ')[0]:'';
  let b=(t.body||'').replace(/\{\{\s*1\s*\}\}/g, nm||'{{1}}');
  return b;
}
function renderMetaTemplates(){
  if(!metaTemplates.length) return '<div class="muted-note">Aún no hay plantillas de Meta. Se crean en Twilio y aparecen aquí con su estado.</div>';
  return metaTemplates.map((t,i)=>{
    const bi=badgeInfo[t.status]||badgeInfo.pending;
    const locked=t.status!=='approved';
    const btns=(t.buttons&&t.buttons.length)?`<div class="btns">${t.buttons.map(b=>'<span>'+esc(b)+'</span>').join('')}</div>`:'';
    const onclick=locked?'':`onclick="sendMetaTemplate(${i})"`;
    return `<div class="tpl-item meta ${bi[0]} ${locked?'locked':''}" ${onclick}>
      <div class="tt">${esc(t.name)}<span class="badge ${bi[0]}">${bi[1]}</span></div>
      <div class="tm">${esc(metaPreview(t))}</div>${btns}
    </div>`;
  }).join('');
}
function openTemplates(){
  const items=templates.map((t,i)=>`
    <div class="tpl-item" onclick="useTemplate(${i})">
      <button class="del" onclick="event.stopPropagation();delTemplate(${i})">Eliminar</button>
      <div class="tt">${esc(t.t)}</div><div class="tm">${esc(t.m)}</div>
    </div>`).join('') || '<div class="muted-note">No hay plantillas aún.</div>';
  document.getElementById('modalRoot').innerHTML=`
   <div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h2>Plantillas</h2>
    <div class="sec-title">Plantillas de Meta (fuera de 24 h)</div>
    ${renderMetaTemplates()}
    <div class="sec-title">Respuestas rápidas (dentro de 24 h)</div>
    ${items}
    <button class="btn ghost" style="margin-top:6px" onclick="addTemplate()">＋ Nueva respuesta rápida</button>
    <div class="muted-note">Las <b>plantillas de Meta</b> reabren conversaciones cerradas (más de 24 h). Solo puedes enviar las <b style="color:#4ade80">verdes</b> (aprobadas). Las <b>respuestas rápidas</b> se insertan en el cuadro de texto y solo funcionan dentro de la ventana de 24 h.</div>
   </div></div>`;
}
async function sendMetaTemplate(i){
  const t=metaTemplates[i];if(!t||t.status!=='approved')return;
  if(!current){alert('Abre o crea un chat primero.');return;}
  const nm=nameOf(current).split(' ')[0]||'Hola';
  const variables=t.varCount>0?{"1":nm}:null;
  closeModal();
  const r=await fetch('/api/send',{method:'POST',headers:hdr(),body:JSON.stringify({to:current,contentSid:t.sid,variables})});
  const d=await r.json();
  if(!d.ok){document.getElementById('sendErr').textContent='No se pudo enviar la plantilla: '+(d.error||'error');}
  await load();
}
function useTemplate(i){
  const t=templates[i];if(!t)return;
  const nm = current? nameOf(current).split(' ')[0] : '';
  const txt=t.m.replace(/\{nombre\}/g, nm||'');
  const ta=document.getElementById('reply');
  ta.value=(ta.value?ta.value+' ':'')+txt;
  closeModal();ta.focus();
}
function addTemplate(){
  const t=prompt('Título de la plantilla:');if(!t)return;
  const m=prompt('Mensaje (puedes usar {nombre}):');if(!m)return;
  templates.push({t:t.trim(),m:m.trim()});saveTpl();openTemplates();
}
function delTemplate(i){if(confirm('¿Eliminar esta plantilla?')){templates.splice(i,1);saveTpl();openTemplates();}}

function logout(){localStorage.removeItem('kv_pass');location.reload();}
if(PASS){document.getElementById('pass').value=PASS;login();}
</script>
</body>
